<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyTaskApp 📝</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f0f2ff;
      --surface: #ffffff;
      --border: #e2e5ff;
      --ink: #1a1040;
      --muted: #8b8fb5;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --accent-light: rgba(124,58,237,0.1);
      --green: #10b981;
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #f59e0b;
      --grad: linear-gradient(135deg, #7c3aed 0%, #06b6d4 100%);
      --grad2: linear-gradient(135deg, #f97316 0%, #f59e0b 100%);
      --shadow: 0 4px 20px rgba(124,58,237,0.12);
      --shadow-sm: 0 2px 10px rgba(0,0,0,0.06);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 20px;
      background-image: radial-gradient(circle at 10% 20%, rgba(124,58,237,0.07) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(6,182,212,0.07) 0%, transparent 50%);
    }

    .top-banner {
      background: var(--grad);
      border-radius: 20px;
      padding: 22px 28px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(124,58,237,0.3);
      position: relative;
      overflow: hidden;
    }

    .top-banner::before {
      content: '';
      position: absolute;
      top: -30px; right: -30px;
      width: 160px; height: 160px;
      background: rgba(255,255,255,0.07);
      border-radius: 50%;
    }

    .top-banner::after {
      content: '';
      position: absolute;
      bottom: -40px; right: 80px;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
    }

    .banner-left { position: relative; z-index: 1; }

    .brand-name {
      font-family: 'Nunito', sans-serif;
      font-size: 1.9rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .brand-name .emoji { font-size: 1.7rem; }

    .brand-sub {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.75);
      font-weight: 500;
      margin-top: 2px;
    }

    .banner-stats {
      display: flex;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .bstat {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 10px 16px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .bstat-num {
      font-family: 'Nunito', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }

    .bstat-label {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-top: 3px;
    }

  
    .layout {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 18px;
    }

  
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .side-card {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      border: 1.5px solid var(--border);
    }

    .side-section-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 14px 14px 6px;
      font-family: 'Nunito', sans-serif;
    }

    .filter-btn {
      width: calc(100% - 14px);
      background: none;
      border: none;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      border-radius: 11px;
      transition: all 0.2s;
      margin: 0 7px;
    }

    .filter-btn:hover { background: var(--accent-light); color: var(--accent); }
    .filter-btn.active {
      background: var(--grad);
      color: #fff;
      box-shadow: 0 4px 12px rgba(124,58,237,0.25);
    }

    .filter-btn-left { display: flex; align-items: center; gap: 9px; }
    .filter-icon { font-size: 1rem; width: 20px; text-align: center; }

    .filter-count {
      background: rgba(0,0,0,0.07);
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 100px;
      font-family: 'Nunito', sans-serif;
    }

    .filter-btn.active .filter-count {
      background: rgba(255,255,255,0.25);
      color: #fff;
    }

    .filters-list { padding: 6px; padding-top: 0; }

    .prio-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    .prio-high { background: var(--red); box-shadow: 0 0 0 2px rgba(239,68,68,0.2); }
    .prio-medium { background: var(--orange); box-shadow: 0 0 0 2px rgba(249,115,22,0.2); }
    .prio-low { background: var(--green); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }

    /* Progress */
    .progress-card { padding: 18px; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-label span:first-child {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
    }

    .progress-label span:last-child {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--accent);
      font-family: 'Nunito', sans-serif;
    }

    .progress-bar {
      height: 8px;
      background: rgba(0,0,0,0.07);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--grad);
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }

    .progress-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .pstat {
      background: var(--bg);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      border: 1.5px solid var(--border);
    }

    .pstat-num {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--accent);
      font-family: 'Nunito', sans-serif;
      line-height: 1.1;
    }

    .pstat-label {
      font-size: 0.6rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

  
    .main-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

  
    .add-card {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 20px;
      border: 1.5px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .add-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--grad);
      border-radius: 18px 18px 0 0;
    }

    .add-card h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .add-card h2::before {
      content: '✨';
      font-size: 1rem;
    }

    .add-row-1 {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .task-input {
      flex: 1;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .task-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }

    .task-input::placeholder { color: var(--muted); font-weight: 400; }

    .add-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .select-input, .date-input {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
      outline: none;
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .select-input:focus, .date-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }

    .add-btn {
      background: var(--grad);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(124,58,237,0.3);
    }

    .add-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
    }

    .add-btn:active { transform: translateY(0); }

  
    .tasks-card {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      flex: 1;
      overflow: hidden;
      border: 1.5px solid var(--border);
    }

    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 14px;
      border-bottom: 1.5px solid var(--border);
      background: linear-gradient(135deg, rgba(124,58,237,0.03), rgba(6,182,212,0.03));
    }

    .tasks-header-left { display: flex; align-items: center; gap: 10px; }

    .tasks-header h2 {
      font-size: 1rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
    }

    .task-count-badge {
      background: var(--grad);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 100px;
      font-family: 'Nunito', sans-serif;
    }

    .sort-select {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 9px;
      padding: 6px 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      outline: none;
    }


    .tasks-body { padding: 10px; }

    .task-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 14px 12px;
      border-radius: 14px;
      transition: all 0.2s;
      position: relative;
      animation: taskIn 0.3s ease;
      border: 1.5px solid transparent;
    }

    @keyframes taskIn {
      from { opacity:0; transform:translateY(-6px) scale(0.99); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    .task-item:hover {
      background: linear-gradient(135deg, rgba(124,58,237,0.04), rgba(6,182,212,0.04));
      border-color: var(--border);
    }

    .task-item.completed { opacity: 0.55; }

    .task-check {
      width: 22px; height: 22px;
      border-radius: 7px;
      border: 2.5px solid var(--border);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .task-check:hover { border-color: var(--accent); background: var(--accent-light); }
    .task-check.checked { background: var(--grad); border-color: transparent; box-shadow: 0 3px 10px rgba(124,58,237,0.3); }
    .task-check.checked::after { content: '✓'; color: #fff; font-size: 0.75rem; font-weight: 800; }

    .task-body { min-width: 0; }

    .task-title {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.4;
      word-break: break-word;
      font-family: 'Poppins', sans-serif;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
      align-items: center;
    }

    .task-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 7px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Nunito', sans-serif;
    }

    .tag-prio-high   { background: rgba(239,68,68,0.1);  color: var(--red); border: 1px solid rgba(239,68,68,0.2); }
    .tag-prio-medium { background: rgba(249,115,22,0.1); color: var(--orange); border: 1px solid rgba(249,115,22,0.2); }
    .tag-prio-low    { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
    .tag-date        { background: rgba(124,58,237,0.08); color: var(--accent); border: 1px solid rgba(124,58,237,0.15); }
    .tag-list        { background: rgba(6,182,212,0.08); color: #0891b2; border: 1px solid rgba(6,182,212,0.15); }
    .tag-overdue     { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.25); animation: blinkBadge 2s infinite; }

    @keyframes blinkBadge { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

    .task-actions {
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .task-item:hover .task-actions { opacity: 1; }

    .task-action-btn {
      width: 32px; height: 32px;
      background: none;
      border: 2px solid var(--border);
      border-radius: 9px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .task-action-btn:hover { border-color: var(--accent); background: var(--accent-light); transform: scale(1.05); }
    .task-action-btn.del:hover { border-color: var(--red); background: rgba(239,68,68,0.1); }


    .edit-input {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 7px 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      margin-bottom: 8px;
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }

    .edit-row { display: flex; gap: 6px; flex-wrap: wrap; }

    .edit-save-btn {
      background: var(--grad);
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(124,58,237,0.25);
    }

    .edit-cancel-btn {
      background: none;
      border: 2px solid var(--border);
      padding: 6px 16px;
      border-radius: 8px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--muted);
    }


    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state-icon { font-size: 3.5rem; margin-bottom: 12px; }
    .empty-state-text { font-size: 0.9rem; font-weight: 600; color: var(--muted); }

  
    .list-tag-input {
      display: flex;
      gap: 6px;
      padding: 8px;
    }

    .list-tag-input input {
      flex: 1;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 9px;
      padding: 7px 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink);
      outline: none;
    }

    .list-tag-input input:focus { border-color: var(--accent); }

    .list-add-btn {
      background: var(--grad);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }

    .divider { height: 1px; background: var(--border); margin: 4px 0; }

    .clear-btn {
      background: none;
      border: none;
      color: var(--red);
      font-family: 'Poppins', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .clear-btn:hover { background: rgba(239,68,68,0.08); }


    .quote-strip {
      background: linear-gradient(135deg, #7c3aed15, #06b6d415);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
      text-align: center;
      font-style: italic;
      font-family: 'Nunito', sans-serif;
    }

    .quote-strip strong { color: var(--accent); font-style: normal; font-weight: 800; }

    @media (max-width: 820px) {
      .top-banner { flex-direction: column; gap: 14px; align-items: flex-start; }
      .banner-stats { width: 100%; justify-content: flex-start; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; flex-wrap: wrap; }
      .side-card { flex: 1; min-width: 220px; }
      .add-row-2 { grid-template-columns: 1fr 1fr; }
      .add-row-2 .add-btn { grid-column: 1/-1; }
    }
  </style>
</head>
<body>


<div style="max-width:1120px;margin:0 auto 20px;">
  <div class="top-banner">
    <div class="banner-left">
      <div class="brand-name"><span class="emoji">📝</span> MyTaskApp</div>
    </div>
    <div class="banner-stats">
      <div class="bstat">
        <div class="bstat-num" id="bTotal">0</div>
        <div class="bstat-label">Total</div>
      </div>
      <div class="bstat">
        <div class="bstat-num" id="bDone">0</div>
        <div class="bstat-label">Done ✅</div>
      </div>
      <div class="bstat">
        <div class="bstat-num" id="bLeft">0</div>
        <div class="bstat-label">Left 🔥</div>
      </div>
    </div>
  </div>
</div>

<div class="layout" style="max-width:1120px;margin:0 auto;">
  
  <div class="sidebar">
    <div class="side-card">
      <div class="side-section-title">📂 Views</div>
      <div class="filters-list">
        <button class="filter-btn active" onclick="setFilter('all',this)">
          <div class="filter-btn-left"><span class="filter-icon">📋</span> All Tasks</div>
          <span class="filter-count" id="cnt-all">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('today',this)">
          <div class="filter-btn-left"><span class="filter-icon">📅</span> Today</div>
          <span class="filter-count" id="cnt-today">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('pending',this)">
          <div class="filter-btn-left"><span class="filter-icon">⏳</span> Pending</div>
          <span class="filter-count" id="cnt-pending">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('completed',this)">
          <div class="filter-btn-left"><span class="filter-icon">✅</span> Completed</div>
          <span class="filter-count" id="cnt-completed">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('overdue',this)">
          <div class="filter-btn-left"><span class="filter-icon">🔴</span> Overdue</div>
          <span class="filter-count" id="cnt-overdue">0</span>
        </button>
      </div>

      <div class="divider"></div>

      <div class="side-section-title">🚦 Priority</div>
      <div class="filters-list">
        <button class="filter-btn" onclick="setFilter('high',this)">
          <div class="filter-btn-left"><span class="prio-dot prio-high"></span> High Priority</div>
          <span class="filter-count" id="cnt-high">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('medium',this)">
          <div class="filter-btn-left"><span class="prio-dot prio-medium"></span> Medium</div>
          <span class="filter-count" id="cnt-medium">0</span>
        </button>
        <button class="filter-btn" onclick="setFilter('low',this)">
          <div class="filter-btn-left"><span class="prio-dot prio-low"></span> Low Priority</div>
          <span class="filter-count" id="cnt-low">0</span>
        </button>
      </div>

      <div class="divider"></div>

      <div class="side-section-title">📁 My Lists</div>
      <div class="filters-list" id="listFilters"></div>
      <div class="list-tag-input">
        <input id="newListInput" type="text" placeholder="Add new list..." maxlength="20" onkeydown="if(event.key==='Enter')addList()"/>
        <button class="list-add-btn" onclick="addList()">+</button>
      </div>
    </div>

   
    <div class="side-card">
      <div class="progress-card">
        <div class="progress-label">
          <span>🎯 Progress</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-stats">
          <div class="pstat">
            <div class="pstat-num" id="pTotal">0</div>
            <div class="pstat-label">Total</div>
          </div>
          <div class="pstat">
            <div class="pstat-num" id="pDone" style="color:var(--green)">0</div>
            <div class="pstat-label">Done</div>
          </div>
          <div class="pstat">
            <div class="pstat-num" id="pLeft" style="color:var(--orange)">0</div>
            <div class="pstat-label">Left</div>
          </div>
        </div>
      </div>
    </div>

   
    <div class="quote-strip">
      <strong>"The secret of getting ahead</strong> is getting started!" 🚀
    </div>
  </div>


  <div class="main-area">
    <div class="add-card">
      <h2>Add New Task</h2>
      <div class="add-row-1">
        <input class="task-input" id="taskInput" type="text" placeholder="What do you need to do today? 💭" onkeydown="if(event.key==='Enter')addTask()"/>
      </div>
      <div class="add-row-2">
        <select class="select-input" id="prioSelect">
          <option value="medium">🟠 Medium Priority</option>
          <option value="high">🔴 High Priority</option>
          <option value="low">🟢 Low Priority</option>
        </select>
        <select class="select-input" id="listSelect">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
        </select>
        <input class="date-input" id="dateInput" type="datetime-local"/>
        <button class="add-btn" onclick="addTask()">+ Add Task</button>
      </div>
    </div>

    <div class="tasks-card">
      <div class="tasks-header">
        <div class="tasks-header-left">
          <h2 id="viewTitle">All Tasks</h2>
          <div class="task-count-badge" id="viewCount">0</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="clear-btn" onclick="clearCompleted()">🗑 Clear done</button>
          <select class="sort-select" id="sortSelect" onchange="render()">
            <option value="date_added">Latest first</option>
            <option value="priority">By priority</option>
            <option value="due_date">By due date</option>
            <option value="az">A → Z</option>
          </select>
        </div>
      </div>
      <div class="tasks-body" id="tasksList"></div>
    </div>
  </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('mytaskapp_tasks') || '[]');
let lists = JSON.parse(localStorage.getItem('mytaskapp_lists') || '["Personal","Work"]');
let currentFilter = 'all';
let editingId = null;

function defaultDate() {
  const d = new Date(); d.setHours(d.getHours()+1, 0);
  return d.toISOString().slice(0,16);
}
document.getElementById('dateInput').value = defaultDate();

function save() {
  localStorage.setItem('mytaskapp_tasks', JSON.stringify(tasks));
  localStorage.setItem('mytaskapp_lists', JSON.stringify(lists));
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function addTask() {
  const title = document.getElementById('taskInput').value.trim();
  if (!title) { document.getElementById('taskInput').focus(); return; }
  tasks.unshift({
    id: uid(),
    title,
    priority: document.getElementById('prioSelect').value,
    list: document.getElementById('listSelect').value,
    dueDate: document.getElementById('dateInput').value || null,
    completed: false,
    createdAt: Date.now()
  });
  document.getElementById('taskInput').value = '';
  document.getElementById('dateInput').value = defaultDate();
  save(); render();
}

function toggleTask(id) {
  const t = tasks.find(t=>t.id===id);
  if(t) { t.completed = !t.completed; save(); render(); }
}

function deleteTask(id) {
  tasks = tasks.filter(t=>t.id!==id);
  save(); render();
}

function startEdit(id) {
  editingId = id; render();
  const inp = document.getElementById('editInput_'+id);
  if(inp) inp.focus();
}

function saveEdit(id) {
  const inp = document.getElementById('editInput_'+id);
  const prio = document.getElementById('editPrio_'+id);
  const date = document.getElementById('editDate_'+id);
  if(!inp) return;
  const val = inp.value.trim();
  if(!val) return;
  const t = tasks.find(t=>t.id===id);
  if(t) {
    t.title = val;
    if(prio) t.priority = prio.value;
    if(date) t.dueDate = date.value || null;
  }
  editingId = null; save(); render();
}

function cancelEdit() { editingId = null; render(); }

function clearCompleted() {
  tasks = tasks.filter(t=>!t.completed);
  save(); render();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const titles = {
    all:'All Tasks 📋', today:'Today 📅', pending:'Pending ⏳',
    completed:'Completed ✅', overdue:'Overdue 🔴',
    high:'High Priority 🔴', medium:'Medium Priority 🟠', low:'Low Priority 🟢'
  };
  document.getElementById('viewTitle').textContent = titles[f] || '📁 ' + f;
  render();
}

function isToday(dateStr) {
  if(!dateStr) return false;
  const d = new Date(dateStr), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

function isOverdue(t) {
  if(!t.dueDate || t.completed) return false;
  return new Date(t.dueDate) < new Date();
}

function filterTasks() {
  let ft = [...tasks];
  switch(currentFilter) {
    case 'today':     ft = ft.filter(t=>isToday(t.dueDate)); break;
    case 'pending':   ft = ft.filter(t=>!t.completed); break;
    case 'completed': ft = ft.filter(t=>t.completed); break;
    case 'overdue':   ft = ft.filter(t=>isOverdue(t)); break;
    case 'high':      ft = ft.filter(t=>t.priority==='high'); break;
    case 'medium':    ft = ft.filter(t=>t.priority==='medium'); break;
    case 'low':       ft = ft.filter(t=>t.priority==='low'); break;
    default:
      if(!['all','today','pending','completed','overdue','high','medium','low'].includes(currentFilter))
        ft = ft.filter(t=>t.list===currentFilter);
  }
  const sort = document.getElementById('sortSelect').value;
  if(sort==='priority') {
    const ord = {high:0,medium:1,low:2};
    ft.sort((a,b)=>(ord[a.priority]||1)-(ord[b.priority]||1));
  } else if(sort==='due_date') {
    ft.sort((a,b)=>{
      if(!a.dueDate) return 1; if(!b.dueDate) return -1;
      return new Date(a.dueDate)-new Date(b.dueDate);
    });
  } else if(sort==='az') {
    ft.sort((a,b)=>a.title.localeCompare(b.title));
  }
  return ft;
}

function formatDate(str) {
  if(!str) return null;
  const d = new Date(str);
  const now = new Date();
  if(isToday(str)) {
    const h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0');
    const ampm=h>=12?'PM':'AM', hh=h%12||12;
    return `Today ${hh}:${m} ${ampm}`;
  }
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) +
    ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}

function addList() {
  const val = document.getElementById('newListInput').value.trim();
  if(!val || lists.includes(val)) return;
  lists.push(val);
  document.getElementById('newListInput').value = '';
  save(); render();
}

function render() {
  const listSel = document.getElementById('listSelect');
  const cur = listSel.value;
  listSel.innerHTML = lists.map(l=>`<option${l===cur?' selected':''}>${l}</option>`).join('');

  const lf = document.getElementById('listFilters');
  lf.innerHTML = lists.map(l=>`
    <button class="filter-btn${currentFilter===l?' active':''}" onclick="setFilter('${l}',this)">
      <div class="filter-btn-left"><span class="filter-icon">📁</span> ${l}</div>
      <span class="filter-count">${tasks.filter(t=>t.list===l).length}</span>
    </button>`).join('');

  document.getElementById('cnt-all').textContent = tasks.length;
  document.getElementById('cnt-today').textContent = tasks.filter(t=>isToday(t.dueDate)).length;
  document.getElementById('cnt-pending').textContent = tasks.filter(t=>!t.completed).length;
  document.getElementById('cnt-completed').textContent = tasks.filter(t=>t.completed).length;
  document.getElementById('cnt-overdue').textContent = tasks.filter(t=>isOverdue(t)).length;
  document.getElementById('cnt-high').textContent = tasks.filter(t=>t.priority==='high').length;
  document.getElementById('cnt-medium').textContent = tasks.filter(t=>t.priority==='medium').length;
  document.getElementById('cnt-low').textContent = tasks.filter(t=>t.priority==='low').length;

  const done = tasks.filter(t=>t.completed).length;
  const total = tasks.length;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('pTotal').textContent = total;
  document.getElementById('pDone').textContent = done;
  document.getElementById('pLeft').textContent = total-done;


  document.getElementById('bTotal').textContent = total;
  document.getElementById('bDone').textContent = done;
  document.getElementById('bLeft').textContent = total-done;

  const filtered = filterTasks();
  document.getElementById('viewCount').textContent = filtered.length;

  if(filtered.length === 0) {
    document.getElementById('tasksList').innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">${currentFilter==='completed'?'🎉':'📭'}</div>
        <div class="empty-state-text">${currentFilter==='completed'?'No completed tasks yet — let\'s get to work! 💪':'No tasks here! Add one above 👆'}</div>
      </div>`;
    return;
  }

  document.getElementById('tasksList').innerHTML = filtered.map(t => {
    const overdue = isOverdue(t);
    const editing = editingId === t.id;
    const prio = t.priority;

    if(editing) {
      return `<div class="task-item">
        <div class="task-check${t.completed?' checked':''}" onclick="toggleTask('${t.id}')"></div>
        <div class="task-body">
          <input class="edit-input" id="editInput_${t.id}" value="${t.title.replace(/"/g,'&quot;')}"
            onkeydown="if(event.key==='Enter')saveEdit('${t.id}');if(event.key==='Escape')cancelEdit()"/>
          <div class="edit-row">
            <select class="select-input" id="editPrio_${t.id}" style="font-size:0.78rem;padding:5px 8px">
              <option value="high"${t.priority==='high'?' selected':''}>🔴 High</option>
              <option value="medium"${t.priority==='medium'?' selected':''}>🟠 Medium</option>
              <option value="low"${t.priority==='low'?' selected':''}>🟢 Low</option>
            </select>
            <input class="date-input" id="editDate_${t.id}" type="datetime-local" value="${t.dueDate||''}"
              style="font-size:0.78rem;padding:5px 8px;flex:1"/>
            <button class="edit-save-btn" onclick="saveEdit('${t.id}')">💾 Save</button>
            <button class="edit-cancel-btn" onclick="cancelEdit()">Cancel</button>
          </div>
        </div>
        <div></div>
      </div>`;
    }

    const dateStr = t.dueDate ? formatDate(t.dueDate) : null;

    return `<div class="task-item${t.completed?' completed':''}">
      <div class="task-check${t.completed?' checked':''}" onclick="toggleTask('${t.id}')"></div>
      <div class="task-body">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          <span class="task-tag tag-prio-${prio}">${prio==='high'?'⬆ High':prio==='low'?'⬇ Low':'⬥ Medium'}</span>
          <span class="task-tag tag-list">📁 ${t.list}</span>
          ${dateStr ? `<span class="task-tag ${overdue&&!t.completed?'tag-overdue':'tag-date'}">
            ${overdue&&!t.completed?'⚠️':'📅'} ${dateStr}
          </span>` : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="task-action-btn" title="Edit" onclick="startEdit('${t.id}')">✏️</button>
        <button class="task-action-btn del" title="Delete" onclick="deleteTask('${t.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
